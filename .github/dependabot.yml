version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    ignore:
      # TypeScript 7 is the native compiler and does not ship the programmatic
      # Language Service API that `astro check` is built on. Pinned to 6.x until
      # withastro/roadmap#1321 lands.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
    groups:
      astro:
        patterns:
          - astro
          - '@astrojs/*'
      dev:
        dependency-type: development

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
